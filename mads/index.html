овеческую эмпатию.","Маркетинг — это не просто набор разрозненных гипотез или красивых картинок. Это стык строгой технологии и гуманитарного понимания мира. За 15+ лет практики я руководила брендами от глобальных гигантов (PepsiCo, P&G) до построения сильной команды с нуля в Тюмени для авиакомпании Utair, когда мы сделали кампанию в 10 раз дешевле бюджета S7 и получили Каннского Льва за стратегию.","Этот курс — концентрированная выжимка всей моей карьеры и практики топовых коллег. Мы не даем оторванной от жизни теории: мы даем нерушимый фундамент, учим гибкости при смене инструментов и показываем, как работает маркетинг в компаниях совершенно разного масштаба и бюджета."]}},_h=[{name:"Виктория Павликова",role:"Senior Brand Manager",company:"PepsiCo",tag:"Куратор"},{name:"Анастасия Нидзий",role:"Бренд-директор",company:"SPLAT Global",tag:"Куратор"}],Mh=[{name:"Дамир Самерханов",role:"Head of Sound Identity",company:"Sixième Son",tag:"Аудиобрендинг"},{name:"Елена Паламарчук",role:"Creative & Brand Director",company:"Jekyll&Hyde",tag:"Брендинг"},{name:"Антон Клейменов",role:"Insights & Analytics Lead",company:"Haleon",tag:"Исследования"},{name:"Мария Уколова",role:"Media Group Head",company:"OMD OM Group",tag:"Медиапланирование"},{name:"Анастасия Каслина",role:"Pitch & Rhetoric Coach",company:"Эксперт по сторителлингу",tag:"Сторителлинг"},{name:"Аня Кау-Тен-Чжи",role:"Head of Visual Communications",company:"Группа ПИК",tag:"Визуал"},{name:"Оля Лоренц",role:"Managing Partner",company:"True Search (HR)",tag:"Карьера"},{name:"Катя Гусакова",role:"Performance & Programmatic Director",company:"Digital Lead",tag:"Paid Social & RTB"},{name:"Олег Клепиков",role:"CEO & Cognitive Researcher",company:"Psychea / Multisensory",tag:"Мультисенсорика"}],Oh=[{num:"01",title:"Сквозная стратегия",desc:"Умение строить целостный маркетинговый план от бизнес-целей до тактического исполнения"},{num:"02",title:"Оценка рынка и ROI",desc:"Расчёт TAM/SAM/SOM, юнит-экономики маркетинга и инвестиционной окупаемости"},{num:"03",title:"Глубинный кастдев",desc:"Проведение интервью, анализ барьеров, болей и истинных мотиваций потребителя"},{num:"04",title:"Инсайты и сегментация",desc:"Качественная и количественная кластеризация аудитории на основе поведенческих паттернов"},{num:"05",title:"Продуктовый подход",desc:"Формирование УТП, ценностных предложений (VPC) и управление циклом инноваций"},{num:"06",title:"Платформа бренда",desc:"Разработка ДНК, миссии, характера и тональности бренда (Tone of Voice)"},{num:"07",title:"Медиамикс и планирование",desc:"Эффективное распределение бюджетов между охватными и конверсионными каналами"},{num:"08",title:"Paid Social & Performance",desc:"Настройка, оптимизация и масштабирование платного трафика в соцсетях"},{num:"09",title:"Programmatic & RTB",desc:"Работа с автоматизированными рекламными сетями и DMP-платформами"},{num:"10",title:"Арт-дирекшн коммуникаций",desc:"Постановка ТЗ креативным командам и контроль визуального качества материалов"},{num:"11",title:"Мультисенсорный маркетинг",desc:"Использование аудио, тактильных и визуальных триггеров для усиления бренда"},{num:"12",title:"C-Level презентация и защита",desc:"Уверенная защита бюджетов и стратегических решений перед топ-менеджментом"}],Ch=[{num:"01",title:"Индивидуальный аудит резюме и портфолио",desc:"Разбор ваших сильных сторон, упаковка кейса по международным стандартам."},{num:"02",title:"Персональная сессия с HR-экспертом индустрии",desc:"Отработка сложных вопросов, скрининг зарплатных ожиданий и стратегии переговоров."},{num:"03",title:"Участие ведущих HR-директоров на защите",desc:"Вашу стратегию оценивают люди, принимающие решения о найме в крупнейших компаниях."},{num:"04",title:"Закрытая рассылка портфолио выпускников",desc:"Прямой контакт с топ-агентствами (Instinct, BBDO, Slava, R/GA) и корпорациями."},{num:"05",title:"Закрытые ивенты и нетворкинг с CMO",desc:"Вход в закрытый клуб выпускников mads и доступ к скрытому рынку вакансий."}],Uh=[{num:"01",title:"Маркетологам, стратегам и аккаунтам",desc:"Тем, кто хочет систематизировать разрозненные знания, вырасти в зарплате и уверенно управлять многомиллионными кампаниями."},{num:"02",title:"Джуниор-специалистам",desc:"Тем, кто хочет получить сильный фундамент от практиков глобальных брендов и составить мощный кейс в портфолио уже на старте."},{num:"03",title:"Мидлам и сеньорам, ставшим хэдами",desc:"Тем, кому нужно выстроить маркетинговый отдел, говорить на одном языке с собственниками и аргументированно защищать бюджеты."},{num:"04",title:"Владельцам бизнеса и фаундерам",desc:"Тем, кто хочет понимать реальную отдачу от маркетинга, контролировать подрядчиков и находить точки взрывного роста."}],Bh=[{name:"Елизавета Андреева",company:"BIOCAD",role:"Маркетинг-лид направления",text:"Курс дал кристальную ясность. Я перестала смотреть на маркетинг как на набор отдельных тестов и увидела целостную систему. Работа в мини-группе и фидбек от Алины помогли перестроить коммуникационную стратегию всего департамента.",rating:5},{name:"Людмила Усольцева",company:"поле.рф",role:"Head of Brand & Communications",text:"Невероятная плотность информации без воды. Шаблоны и фреймворки, которые дали кураторы, я внедрила в реальную работу уже на третьей неделе курса. Защита перед жюри — отдельный мощнейший драйвер роста.",rating:5},{name:"Катя Масленникова",company:"Сколково",role:"Senior Marketing Strategist",text:"Здесь нет школярства — только боевые задачи. Созвоны с кураторами из PepsiCo и SPLAT дали понимание того, как мыслят директора мирового уровня. После выпуска сразу получила оффер с повышением грейда.",rating:5},{name:"Лиза Андреева",company:"Mars / Wrigley / CMI",role:"Consumer & Market Insights Lead",text:"Курс mads — это эталон профессионального образования. Ты учишься не по учебникам 10-летней давности, а на актуальных бенчмарках. Сторителлинг и защита стратегии перевернули мое представление о презентации идей.",rating:5}],Rh=[{author:"Роман Фирайнер",role:"Chief Creative Officer",company:"Instinct",quote:"«mads выпускает стратегов и маркетологов, которые готовы работать в агентствах высшей лиги с первого дня. У них есть системное мышление и вкус к смелым идеям»."},{author:"Денис Лапшинов",role:"Co-founder & Creative Director",company:"Slava",quote:"«Разница между дилетантом и профессионалом — в умении обосновать смелое решение цифрами и логикой. На этом курсе учат именно этому синтезу»."},{author:"Алина Щербинина",role:"CMO & Strategy Director",company:"PepsiCo & Utair (ex)",quote:"«Стратегия — это умение выбирать, от чего отказаться. Мы учим создавать маркетинг, который приносит измеримую прибыль и меняет культуру»."},{author:"Дима Тютьков",role:"Founder & Managing Partner",company:"tutkovbudkov",quote:"«Выпускники mads обладают редким качеством — они не боятся ответственности и умеют защищать проект перед самыми требовательными стейкхолдерами»."}],Hh=[{value:"13 лет",label:"Опыта на острие креативного и маркетингового образования"},{value:"Young Glory",label:"Победители мирового рейтинга 2020 года"},{value:"5 раз",label:"Школа года по версии главного фестиваля рекламы Red Apple"},{value:"200+",label:"Действующих топ-экспертов в сообществе и пуле преподавателей"},{value:"Top Agencies",label:"Выпускники работают в Instinct, BBDO, Leo Burnett, Saatchi, Slava, Possible, Friends, R/GA London"},{value:"Private Club",label:"Закрытый нетворкинг и постоянная поддержка выпускников в карьере"}],qh=[{question:"Когда начинается обучение и сколько оно длится?",answer:"Старт курса — 24 ноября. Программа длится до 20 марта (4 месяца) и включает 1 сквозной раздел из 36 полноценных практических занятий, вебинаров и созвонов с кураторами."},{question:"В чем разница между форматами обучения?",answer:"В «Полноценном онлайн-курсе» (живой поток) вы работаете в мини-группе, получаете персональный еженедельный фидбек кураторов, участвуете в живых созвонах и защищаете стратегию перед жюри и HR. В «Самостоятельном формате» вам доступны все записи лекций и эталонные разборы домашних заданий."},{question:"Могу ли я делать проект для своего реального бизнеса или компании?",answer:"Да! Опытные участники могут взять собственный бизнес-проект при условии предоставления вводных данных в течение первых 2 недель после стартового вебинара и непрерывной работы по нему на протяжении всего курса. Также доступен учебный бриф от реального бренда-партнера."},{question:"Как работает рассрочка без переплаты?",answer:"Мы предоставляем беспроцентную банковскую рассрочку на срок до 10-12 месяцев без скрытых комиссий и первоначального взноса. Выплачиваете равными долями (от 8 769 ₽/мес за самостоятельный тариф или 17 259 ₽/мес за полноценный курс)."},{question:"Как школа помогает с трудоустройством и карьерой?",answer:"Программа включает карьерный блок с Олей Лоренц (True Search), индивидуальные консультации, аудит резюме, приглашение HR-директоров на защиту дипломов и прямую рассылку портфолио выпускников в партнерские агентства и бренды."}],Yh=()=>i.jsx("section",{id:"skills",className:"relative bg-[#121214] text-[#F6F6F5] py-24 sm:py-32 px-6 sm:px-10 border-t border-white/5",children:i.jsxs("div",{className:"max-w-7xl mx-auto",children:[i.jsxs("div",{className:"flex items-center gap-3 text-xs font-mono text-[#D8F83A] uppercase tracking-widest mb-6",children:[i.jsx("span",{className:"w-2 h-2 rounded-full bg-[#D8F83A]"}),i.jsx("span",{children:"05 / Профессиональный стек"})]}),i.jsxs("div",{className:"max-w-3xl mb-16",children:[i.jsx("h2",{className:"font-unbounded text-2xl sm:text-4xl md:text-5xl font-bold tracking-tight text-[#F6F6F5]",children:"12 ключевых навыков выпускника"}),i.jsx("p",{className:"mt-4 text-base sm:text-lg text-[#A1A1AA]",children:"Навыки, которые трансформируют маркетолога из исполнителя в стратегического лидера."})]}),i.jsx("div",{className:"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6",children:Oh.map(b=>i.jsxs("div",{className:"p-8 rounded-3xl bg-[#18181C] border border-white/5 hover:border-white/20 transi
